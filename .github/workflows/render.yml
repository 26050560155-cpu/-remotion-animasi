name: Render Remotion Video

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      title:
        description: 'Judul animasi'
        default: 'Halo, Remotion!'
      subtitle:
        description: 'Subjudul animasi'
        default: 'Dirender otomatis lewat GitHub Actions'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Render video
        env:
          TITLE: ${{ github.event.inputs.title || 'Halo, Remotion!' }}
          SUBTITLE: ${{ github.event.inputs.subtitle || 'Dirender otomatis lewat GitHub Actions' }}
        run: |
          npx remotion render MyAnimation out/video.mp4 \
            --props="$(jq -n --arg t "$TITLE" --arg s "$SUBTITLE" '{title:$t, subtitle:$s}')"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
